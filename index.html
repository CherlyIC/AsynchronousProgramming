<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center  bg-gradient-to-br  from-blue-600 to-cyan-400  p-4 font-sans">
  <div class = "bg-white rounded-2xl shadow-2xl p-8 w-full max-w-lg transition-all duration-300 "> 
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold text-gray-800">Pokédex</h1> 

      <p>Search for any Pokémon by name or ID</p>

    </div>

    <div class="flex gap-2 mb-6">
      <input
        id="search-input"
        type="text"
        placeholder="enter pokemon name or ID"
        class="flex-1 border border-white-300 rounded-lg  px-4 py-2  text-gray-700 focus:outline-none  focus:ring-2 focus:ring-blue-400  transition duration-200"
      />

      <button id="search-btn" class="bg-blue-500 hover:bg-blue-700 text-white font-semibold px-5 py-2 rounded-lg transition duration-200">Search</button>

    </div>

     <div id="loading" class="hidden justify-center my-6">
      <div class="animate-spin h-10 w-10 rounded-full border-4 border-blue-500 border-t-transparent">

      </div>
    </div>

    <div id="Pokemon-card"></div>



  </div>


  
</body>
</html>
